[project]
name = "orbit"
version = "0.1.0"
description = "Partner market tracker: who is where, and what has changed, at top law firms."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Only dependencies approved in CLAUDE.md. playwright is approved but not listed:
# no adapter needs a headless browser yet, so we don't install one.
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0.2",  # selectolax.lexbor; 1.0 removed the old default parser
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
orbit = "orbit.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
